services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?copy .env.example to .env}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 5s
      timeout: 3s
      retries: 30
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      ADMIN_IDENTIFIER: ${ADMIN_IDENTIFIER:?required}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?required}
      INITIAL_ACCOUNT_PASSWORD: ${INITIAL_ACCOUNT_PASSWORD:?required}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8080}
      TZ: UTC
    volumes: ["uploaded-images:/app/uploads"]
    ports: ["3000:3000"]
    depends_on: { mysql: { condition: service_healthy } }
  admin:
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  mysql-data:
  uploaded-images:
